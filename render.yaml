services:
  - type: web
    name: dalilacom-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run deploy:migrate && npm run prisma:seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dalilacom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QR_TOKEN_TTL_SECONDS
        value: "30"

databases:
  - name: dalilacom-db
    plan: free
    databaseName: dalilacom
    user: dalilacom
