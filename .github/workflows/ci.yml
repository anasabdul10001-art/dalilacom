name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dalilacom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dalilacom_ci
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret
      CREDENTIALS_ENCRYPTION_KEY: ci-only-credentials-key-not-a-real-secret
      PUBLIC_BASE_URL: http://localhost:4000
      PORT: 4000
      QR_TOKEN_TTL_SECONDS: 30
      EMAIL_VERIFICATION_TOKEN_TTL_HOURS: 24
      PASSWORD_RESET_TOKEN_TTL_MINUTES: 30
      AUTH_LOGIN_RATE_LIMIT: 200
      AUTH_REGISTER_RATE_LIMIT: 200
      AUTH_FORGOT_PASSWORD_RATE_LIMIT: 200
      AUTH_RESET_PASSWORD_RATE_LIMIT: 200
      AUTH_VERIFY_EMAIL_RATE_LIMIT: 200
      AUTH_RESEND_VERIFICATION_RATE_LIMIT: 200
      AUTH_SOCIAL_RATE_LIMIT: 200
      QR_REDEEM_RATE_LIMIT: 200
      QR_VERIFY_RATE_LIMIT: 200

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run deploy:migrate

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    # The Android app had no wrapper and no CI job, so a broken Kotlin file was only ever found by
    # whoever happened to build locally. This job builds the same artefact they install.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      # chmod because the executable bit on gradlew is not something Windows can set.
      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: dalilacom-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
