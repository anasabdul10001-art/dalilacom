<base href="/app/" />
<link rel="icon" href="/brand/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/brand/favicon-64.png"><link rel="apple-touch-icon" href="/brand/logo-192.png">
<title>دليلكم — كل محلات مدينتك وعروضها بمكان واحد</title>
<!--share:start-->
<meta name="description" content="اكتشف المحلات والمطاعم والخدمات القريبة منك، واستفد من خصومات حصرية ببطاقة عضوية واحدة. ابحث على الخريطة واطلب بسهولة ووفّر مع دليلكم." />
<meta property="og:type" content="website" />
<meta property="og:title" content="دليلكم — كل محلات مدينتك وعروضها بمكان واحد" />
<meta property="og:image" content="/brand/og-share.png" />
<meta name="theme-color" content="#ba2a34" />
<!--share:end-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page-head">
  <div class="brand"><img class="mark" src="/brand/logo.png" alt="DALILACOM" width="44" height="44"> دليلكم — DALILACOM</div>
  <p>معاينة حيّة للتطبيق — نفس الـ Backend الحقيقي، مو بيانات وهمية. القالب هون HTML وليس التصميم النهائي بالـ Android.</p>
  <div class="live-pill"><span class="dot"></span> متصل بالسيرفر الحقيقي</div>
</div>

<div class="device">
  <div class="screen">
    <div class="notch"></div>
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span>🔋 5G</span>
    </div>
    <div class="screen-body" id="screen-body"></div>
  </div>
</div>

<div id="print-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="i18n.js"></script>
<script src="i18n.ar.js"></script>
<script src="i18n.en.js"></script>
<script src="app.js"></script>
<script>
  function tickClock() {
    const el = document.getElementById("clock");
    if (el) el.textContent = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }
  tickClock();
  setInterval(tickClock, 30000);
</script>
</body>
</html>
