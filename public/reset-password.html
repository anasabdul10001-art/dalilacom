<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/brand/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/brand/favicon-64.png"><link rel="apple-touch-icon" href="/brand/logo-192.png">
<title>إعادة تعيين كلمة السر — دليلكم</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #5A0E12, #BA2A34); }
  .card { background: #fff; border-radius: 16px; padding: 32px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  h1 { margin: 0 0 4px; font-size: 20px; color: #BA2A34; }
  p { margin: 0 0 16px; color: #777; font-size: 13px; }
  label { display: block; font-size: 12px; color: #666; margin: 8px 0 3px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  button { width: 100%; margin-top: 16px; background: #BA2A34; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 13px; text-align: center; }
  .msg.error { color: #b71c1c; }
  .msg.ok { color: #1e7e34; }
</style>
</head>
<body>
<div class="card">
  <h1>🅳 دليلكم</h1>

  <!-- Step 1: no token in the URL yet — request a reset link by email -->
  <div id="request-form">
    <p>أدخل بريدك الإلكتروني وبنبعتلك رابط لإعادة تعيين كلمة السر</p>
    <label>البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username" />
    <button id="requestBtn" onclick="submitRequest()">إرسال رابط إعادة التعيين</button>
  </div>

  <!-- Step 2: token present in the URL (came from the email link) — set the new password -->
  <div id="reset-form" style="display:none">
    <p>عيّن كلمة سر جديدة لحسابك</p>
    <label>كلمة السر الجديدة</label>
    <input id="pw" type="password" minlength="8" autocomplete="new-password" placeholder="8 أحرف على الأقل" />
    <label>تأكيد كلمة السر</label>
    <input id="pw2" type="password" minlength="8" autocomplete="new-password" />
    <button id="submitBtn" onclick="submitReset()">تغيير كلمة السر</button>
  </div>

  <div id="msg" class="msg" style="display:none"></div>
</div>
<script>
function getToken() {
  return new URLSearchParams(window.location.search).get("token") || "";
}
function showMsg(text, ok) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "error");
  el.style.display = "block";
}
async function submitRequest() {
  const email = document.getElementById("email").value.trim();
  if (!email) { showMsg("أدخل بريدك الإلكتروني", false); return; }
  document.getElementById("requestBtn").disabled = true;
  try {
    const res = await fetch("/auth/forgot-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    const data = await res.json().catch(() => ({}));
    document.getElementById("request-form").style.display = "none";
    showMsg(data.message || "إذا كان هذا البريد مسجّلًا، أرسلنا رابط إعادة التعيين", true);
  } catch {
    showMsg("تعذّر الاتصال بالسيرفر", false);
    document.getElementById("requestBtn").disabled = false;
  }
}
async function submitReset() {
  const token = getToken();
  const pw = document.getElementById("pw").value;
  const pw2 = document.getElementById("pw2").value;
  if (pw.length < 8) { showMsg("كلمة السر يجب أن تكون 8 أحرف على الأقل", false); return; }
  if (pw !== pw2) { showMsg("كلمتا السر غير متطابقتين", false); return; }

  document.getElementById("submitBtn").disabled = true;
  try {
    const res = await fetch("/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword: pw }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      document.getElementById("reset-form").style.display = "none";
      showMsg(data.message || "تم تغيير كلمة السر بنجاح", true);
    } else {
      showMsg((data.error && data.error.message) || "تعذّر تغيير كلمة السر", false);
      document.getElementById("submitBtn").disabled = false;
    }
  } catch {
    showMsg("تعذّر الاتصال بالسيرفر", false);
    document.getElementById("submitBtn").disabled = false;
  }
}
(function init() {
  if (getToken()) {
    document.getElementById("request-form").style.display = "none";
    document.getElementById("reset-form").style.display = "block";
  }
})();
</script>
</body>
</html>
