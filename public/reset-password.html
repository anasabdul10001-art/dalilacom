<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/brand/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/brand/favicon-64.png"><link rel="apple-touch-icon" href="/brand/logo-192.png">
<title>إعادة تعيين كلمة السر — دليلكم</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #5A0E12, #BA2A34); }
  .card { background: #fff; border-radius: 16px; padding: 32px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  h1 { margin: 0 0 4px; font-size: 20px; color: #BA2A34; }
  p { margin: 0 0 16px; color: #777; font-size: 13px; }
  label { display: block; font-size: 12px; color: #666; margin: 8px 0 3px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  button { width: 100%; margin-top: 16px; background: #BA2A34; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 13px; text-align: center; }
  .msg.error { color: #b71c1c; }
  .msg.ok { color: #1e7e34; }
  .home { display: block; margin-top: 16px; padding: 10px 16px; border-radius: 8px; background: #BA2A34; color: #fff; text-align: center; font-weight: 600; font-size: 14px; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <h1><span id="brand">🅳 دليلكم</span></h1>

  <!-- Step 1: no token in the URL yet — request a reset link by email -->
  <div id="request-form">
    <p data-i18n="askEmail">أدخل بريدك الإلكتروني وبنبعتلك رابط لإعادة تعيين كلمة السر</p>
    <label data-i18n="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username" dir="ltr" placeholder="name@example.com" />
    <button id="requestBtn" onclick="submitRequest()" data-i18n="sendLink">إرسال رابط إعادة التعيين</button>
  </div>

  <!-- Step 2: token present in the URL (came from the email link) — set the new password -->
  <div id="reset-form" style="display:none">
    <p data-i18n="setNew">عيّن كلمة سر جديدة لحسابك</p>
    <label data-i18n="newPw">كلمة السر الجديدة</label>
    <input id="pw" type="password" minlength="8" autocomplete="new-password" placeholder="8 أحرف على الأقل" data-i18n-ph="min8" />
    <label data-i18n="confirmPw">تأكيد كلمة السر</label>
    <input id="pw2" type="password" minlength="8" autocomplete="new-password" placeholder="••••••••" />
    <button id="submitBtn" onclick="submitReset()" data-i18n="change">تغيير كلمة السر</button>
  </div>

  <div id="msg" class="msg" style="display:none"></div>
  <a id="home" class="home" href="/app/" style="display:none" data-i18n="goHome">الذهاب إلى الموقع وتسجيل الدخول</a>
</div>
<script src="/app/pw-eye.js"></script>
<script src="/reset-password.js"></script>
</body>
</html>
