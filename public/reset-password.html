<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/brand/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/brand/favicon-64.png"><link rel="apple-touch-icon" href="/brand/logo-192.png">
<title>إعادة تعيين كلمة السر — دليلكم</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #5A0E12, #BA2A34); }
  .card { background: #fff; border-radius: 16px; padding: 32px; width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  h1 { margin: 0 0 4px; font-size: 20px; color: #BA2A34; }
  p { margin: 0 0 16px; color: #777; font-size: 13px; }
  label { display: block; font-size: 12px; color: #666; margin: 8px 0 3px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
  button { width: 100%; margin-top: 16px; background: #BA2A34; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 13px; text-align: center; }
  .msg.error { color: #b71c1c; }
  .msg.ok { color: #1e7e34; }
</style>
</head>
<body>
<div class="card">
  <h1><span id="brand">🅳 دليلكم</span></h1>

  <!-- Step 1: no token in the URL yet — request a reset link by email -->
  <div id="request-form">
    <p data-i18n="askEmail">أدخل بريدك الإلكتروني وبنبعتلك رابط لإعادة تعيين كلمة السر</p>
    <label data-i18n="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="username" dir="ltr" placeholder="name@example.com" />
    <button id="requestBtn" onclick="submitRequest()" data-i18n="sendLink">إرسال رابط إعادة التعيين</button>
  </div>

  <!-- Step 2: token present in the URL (came from the email link) — set the new password -->
  <div id="reset-form" style="display:none">
    <p data-i18n="setNew">عيّن كلمة سر جديدة لحسابك</p>
    <label data-i18n="newPw">كلمة السر الجديدة</label>
    <input id="pw" type="password" minlength="8" autocomplete="new-password" placeholder="8 أحرف على الأقل" data-i18n-ph="min8" />
    <label data-i18n="confirmPw">تأكيد كلمة السر</label>
    <input id="pw2" type="password" minlength="8" autocomplete="new-password" placeholder="••••••••" />
    <button id="submitBtn" onclick="submitReset()" data-i18n="change">تغيير كلمة السر</button>
  </div>

  <div id="msg" class="msg" style="display:none"></div>
</div>
<script src="/app/pw-eye.js"></script>
<script>
// The page speaks the language of the e-mail link (?lang=), else the one chosen on the website, else the phone's.
const TXT = {
  ar: { title: "إعادة تعيين كلمة السر — دليلكم", brand: "🅳 دليلكم", askEmail: "أدخل بريدك الإلكتروني وبنبعتلك رابط لإعادة تعيين كلمة السر", email: "البريد الإلكتروني", sendLink: "إرسال رابط إعادة التعيين",
    setNew: "عيّن كلمة سر جديدة لحسابك", newPw: "كلمة السر الجديدة", min8: "8 أحرف على الأقل", confirmPw: "تأكيد كلمة السر", change: "تغيير كلمة السر",
    needEmail: "أدخل بريدك الإلكتروني", sent: "إذا كان هذا البريد مسجّلًا، أرسلنا رابط إعادة التعيين", noServer: "تعذّر الاتصال بالسيرفر",
    short: "كلمة السر يجب أن تكون 8 أحرف على الأقل", mismatch: "كلمتا السر غير متطابقتين", done: "تم تغيير كلمة السر بنجاح", failed: "تعذّر تغيير كلمة السر" },
  en: { title: "Reset your password — Dalilacom", brand: "🅳 Dalilacom", askEmail: "Enter your email and we will send you a link to reset your password", email: "Email", sendLink: "Send the reset link",
    setNew: "Choose a new password for your account", newPw: "New password", min8: "At least 8 characters", confirmPw: "Confirm password", change: "Change password",
    needEmail: "Enter your email", sent: "If this email is registered, we have sent the reset link", noServer: "Could not reach the server",
    short: "The password must be at least 8 characters", mismatch: "The two passwords do not match", done: "Your password was changed", failed: "Could not change the password" },
};
function pickLang() {
  const asked = (new URLSearchParams(location.search).get("lang") || "").slice(0, 2).toLowerCase();
  if (asked === "ar" || asked === "en") return asked;
  try { const saved = localStorage.getItem("dlk_lang"); if (saved === "ar" || saved === "en") return saved; } catch (e) {}
  const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
  for (const l of list) { const c = String(l).slice(0, 2).toLowerCase(); if (c === "ar" || c === "en") return c; }
  return "en";
}
const LANG = pickLang();
const T = TXT[LANG];
document.documentElement.lang = LANG;
document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
document.title = T.title;
document.getElementById("brand").textContent = T.brand;
document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = T[el.dataset.i18n]; });
document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = T[el.dataset.i18nPh]; });
const JSON_HEADERS = { "Content-Type": "application/json", "Accept-Language": LANG };

function getToken() {
  return new URLSearchParams(window.location.search).get("token") || "";
}
function showMsg(text, ok) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "error");
  el.style.display = "block";
}
async function submitRequest() {
  const email = document.getElementById("email").value.trim();
  if (!email) { showMsg(T.needEmail, false); return; }
  document.getElementById("requestBtn").disabled = true;
  try {
    const res = await fetch("/auth/forgot-password", {
      method: "POST",
      headers: JSON_HEADERS,
      body: JSON.stringify({ email }),
    });
    const data = await res.json().catch(() => ({}));
    document.getElementById("request-form").style.display = "none";
    showMsg(data.message || T.sent, true);
  } catch {
    showMsg(T.noServer, false);
    document.getElementById("requestBtn").disabled = false;
  }
}
async function submitReset() {
  const token = getToken();
  const pw = document.getElementById("pw").value;
  const pw2 = document.getElementById("pw2").value;
  if (pw.length < 8) { showMsg(T.short, false); return; }
  if (pw !== pw2) { showMsg(T.mismatch, false); return; }

  document.getElementById("submitBtn").disabled = true;
  try {
    const res = await fetch("/auth/reset-password", {
      method: "POST",
      headers: JSON_HEADERS,
      body: JSON.stringify({ token, newPassword: pw }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      document.getElementById("reset-form").style.display = "none";
      showMsg(data.message || T.done, true);
    } else {
      showMsg((data.error && data.error.message) || T.failed, false);
      document.getElementById("submitBtn").disabled = false;
    }
  } catch {
    showMsg(T.noServer, false);
    document.getElementById("submitBtn").disabled = false;
  }
}
(function init() {
  if (getToken()) {
    document.getElementById("request-form").style.display = "none";
    document.getElementById("reset-form").style.display = "block";
  }
})();
</script>
</body>
</html>
