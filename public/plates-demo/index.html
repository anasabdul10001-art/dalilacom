<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>منصة مزادات اللوحات المميزة – نموذج أولي</title>
<style>
:root{--g:#0b5d3b;--g2:#0e7a4f;--ink:#1b2a24;--mut:#5d6b64;--bg:#f3f6f4;--card:#fff;--line:#dbe4df;--gold:#b8892b;--red:#b3261e;--blue:#1a5fb4}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:var(--g);text-decoration:none}
.demo-bar{background:#fff7e0;border-bottom:1px solid #ecd68a;color:#6b4e00;font-size:13px;text-align:center;padding:6px 12px}
header{background:var(--g);color:#fff}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 0}
.brand{font-weight:700;font-size:18px;flex:1;min-width:220px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.85}
nav a{color:#fff;margin-inline-start:14px;font-size:14px;opacity:.9;padding:4px 2px;border-bottom:2px solid transparent}
nav a.on{border-color:#fff;opacity:1}
main{padding:20px 0 48px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:18px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.plate{direction:rtl;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:3px solid #111;border-radius:8px;padding:6px 14px;font-weight:800;box-shadow:inset 0 0 0 2px #fff,0 0 0 1px #aaa;margin:2px auto 10px;max-width:260px}
.plate .gov{font-size:13px;color:#111;border-inline-end:2px solid #111;padding-inline-end:10px}
.plate .num{font-size:30px;letter-spacing:2px;font-family:"Segoe UI",Arial,sans-serif;direction:ltr}
.plate.big{max-width:360px}.plate.big .num{font-size:44px}.plate.big .gov{font-size:16px}
.price{font-size:20px;font-weight:700;color:var(--g)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--mut);margin:3px 0}
.row b{color:var(--ink)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.hot{color:var(--red)}
.btn{display:inline-block;border:0;background:var(--g);color:#fff;padding:9px 16px;border-radius:8px;font:inherit;cursor:pointer;font-size:14px}
.btn:hover{background:var(--g2)}.btn.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.red{background:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;margin-top:8px}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#e6f2ec;color:var(--g)}
.badge.end{background:#eee;color:#555}.badge.warn{background:#fdecea;color:var(--red)}.badge.gold{background:#fbf1dc;color:#7a5a12}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:start;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600;font-size:13px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:22px;color:var(--g)}
.note{background:#eef6f1;border:1px solid #cfe3d8;border-radius:8px;padding:10px 12px;font-size:13px;color:#24493a;margin:10px 0}
.warnbox{background:#fdecea;border:1px solid #f3c1bc;color:#7a1c16}
.hash{font-family:Consolas,monospace;font-size:11px;direction:ltr;display:inline-block;color:#555}
.toast{position:fixed;bottom:18px;inset-inline-start:18px;background:#1b2a24;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;max-width:90vw}
.steps{display:flex;gap:8px;margin:8px 0 14px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 10px;border-radius:99px;background:#e9eeeb;color:#555}.steps span.on{background:var(--g);color:#fff}
footer{color:var(--mut);font-size:12px;text-align:center;padding:20px}
.ok{color:var(--g);font-weight:700}.bad{color:var(--red);font-weight:700}
.mine{background:#eef6f1}
.card{position:relative}.star{position:absolute;inset-inline-start:10px;top:8px;border:0;background:none;font-size:24px;line-height:1;color:#b8892b;cursor:pointer}.star.on{color:#d49a12}
</style>
</head>
<body>
<div class="demo-bar">نموذج أولي للتوضيح فقط: جميع الأرقام والأسماء والمبالغ والمزايدين بيانات تجريبية، ولا يوجد أي دفع حقيقي.</div>
<header><div class="wrap top">
  <div class="brand">منصة المزادات الإلكترونية للوحات المركبات المميزة<small>الجمهورية العربية السورية – وزارة النقل (نموذج أولي مقترح)</small></div>
  <nav id="nav"></nav>
</div></header>
<main class="wrap" id="app"></main>
<footer>نموذج أولي لأغراض الاستعراض في ردّ طلب المعلومات (RFI). <a href="#/reset" id="resetLink">إعادة ضبط البيانات التجريبية</a></footer>
<div id="toast" class="toast" style="display:none"></div>

<script src="app.js"></script>
</body>
</html>
