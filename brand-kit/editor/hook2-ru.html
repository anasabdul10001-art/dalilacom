<!doctype html><html lang="ru" dir="ltr"><meta charset="utf-8">
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;background:#fff4ee}
#bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(14px) saturate(1.1);opacity:.55}
#shot{position:absolute;left:260px;top:150px;width:1400px;height:787px;border-radius:26px;box-shadow:0 30px 80px rgba(120,50,20,.45);background-size:cover;opacity:0}
#q{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#q .a{font-size:128px;font-weight:800;color:#2a1f1c;line-height:1.1;text-shadow:0 6px 0 #fff}
#q .b{font-size:210px;font-weight:800;color:#e8643a;line-height:1.05;text-shadow:0 6px 0 #fff,0 18px 50px rgba(244,128,80,.6)}
#q .c{font-size:110px;font-weight:800;color:#2a1f1c;margin-top:6px}
#burst{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(0);opacity:0;text-align:center}
#burst .tag{display:inline-block;white-space:nowrap;font-size:92px;font-weight:800;color:#fff;background:linear-gradient(135deg,#f48050,#e8643a);padding:24px 80px;border-radius:120px;box-shadow:0 30px 80px rgba(196,85,43,.6)}
#burst .sub{font-size:64px;font-weight:800;color:#2a1f1c;margin-top:34px;text-shadow:0 5px 0 #fff}
#sub{position:absolute;left:0;right:0;bottom:60px;text-align:center;font-size:64px;font-weight:800;color:#fff;opacity:0}
#sub span{background:linear-gradient(135deg,#f48050,#e8643a);padding:10px 50px;border-radius:70px;box-shadow:0 14px 40px rgba(196,85,43,.5)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;text-align:center}
#logo img{height:260px}
#logo .t{font-size:70px;font-weight:800;color:#2a1f1c;margin-top:20px}
#logo .t b{color:#e8643a}
</style>
<div id="bg"></div><div id="shot"></div>
<div id="q"><div class="a">Программа учёта</div><div class="b">бесплатно</div><div class="c">на 3 месяца</div></div>
<div id="burst"><div class="tag">Успейте воспользоваться!</div><div class="sub">Предложение к запуску от Dalilacom</div></div>
<div id="sub"><span>Покажем каждый шаг подробно</span></div>
<div id="flash"></div>
<div id="logo"><img id="lg"><div class="t">Бухгалтерия <b>Dalilacom</b> шаг за шагом</div></div>
<script>
const ease={out:t=>1-Math.pow(1-t,3),back:t=>{const c=2;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},inout:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const $=id=>document.getElementById(id);
window.setup=(img,logo)=>{$('bg').style.backgroundImage=`url(${img})`;$('shot').style.backgroundImage=`url(${img})`;$('lg').src=logo};
// 0-3.3 big offer text (full size at frame 0) | 3.3-5.3 burst badge | 5.3-7.3 screen + sub | 7.3-8 logo
window.draw=t=>{
  const q=$('q'),bu=$('burst'),s=$('shot'),sub=$('sub'),fl=$('flash'),lg=$('logo');
  $('bg').style.transform=`scale(${1+t*0.012})`;
  const qa=t<3.3?1:cl(1-(t-3.3)/.2);q.style.opacity=qa;
  q.style.transform=`scale(${1+0.04*Math.sin(Math.min(t,3.3)*3.4)+(t<.25?0.1*(1-t/.25):0)})`;
  q.querySelector('.b').style.transform=`scale(${1+0.06*Math.abs(Math.sin(t*5))})`;
  const bt=t-3.3;
  if(bt>=0&&t<5.5){const p=ease.back(cl(bt/.45));bu.style.opacity=cl(bt/.15)*(t>5.3?1-(t-5.3)/.2:1);bu.style.transform=`translate(-50%,-50%) scale(${p*(1+0.03*Math.sin(bt*8))}) rotate(${(1-p)*-6}deg)`}else bu.style.opacity=0;
  const st=t-5.3;
  if(st>=0&&t<7.45){const p=ease.back(cl(st/.55));s.style.opacity=cl(st/.25);s.style.transform=`scale(${(.8+.2*p)*(1+Math.max(0,st-.6)*0.02)}) rotate(${(1-p)*-4}deg)`;sub.style.opacity=cl((st-.5)/.2);sub.style.transform=`translateY(${(1-ease.out(cl((st-.5)/.4)))*80}px)`}else{s.style.opacity=0;sub.style.opacity=0}
  fl.style.opacity=t>7.2&&t<7.6?1-Math.abs((t-7.4)/.2):0;
  const lt=t-7.4;lg.style.opacity=lt>=0?cl(lt/.25):0;lg.style.transform=`translate(-50%,-50%) scale(${.7+.3*ease.back(cl(lt/.5))})`;
};
</script></html>
