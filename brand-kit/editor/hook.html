<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8">
<style>
@font-face{font-family:T;src:url(../fonts/tajawal_bold.ttf);font-weight:800}
@font-face{font-family:T;src:url(../fonts/tajawal_medium.ttf);font-weight:500}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:T,sans-serif;background:#fff4ee}
#bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(14px) saturate(1.1);opacity:.55}
#shot{position:absolute;left:260px;top:170px;width:1400px;height:787px;border-radius:26px;box-shadow:0 30px 80px rgba(120,50,20,.45);background-size:cover;opacity:0}
#q{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#q .big{font-size:190px;font-weight:800;color:#2a1f1c;line-height:1.1;text-shadow:0 6px 0 #fff,0 14px 40px rgba(244,128,80,.55)}
#q .big b{color:#e8643a}
#cnt{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:linear-gradient(135deg,#f48050,#e8643a);color:#fff;font-size:300px;font-weight:800;display:grid;place-items:center;opacity:0;box-shadow:0 30px 80px rgba(196,85,43,.6)}
#sub{position:absolute;left:0;right:0;bottom:90px;text-align:center;font-size:84px;font-weight:800;color:#fff;opacity:0}
#sub span{background:linear-gradient(135deg,#f48050,#e8643a);padding:10px 50px;border-radius:70px;box-shadow:0 14px 40px rgba(196,85,43,.5)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;text-align:center}
#logo img{height:260px}
#logo .t{font-size:96px;font-weight:800;color:#2a1f1c;margin-top:20px}
#logo .t b{color:#e8643a}
#prof{position:absolute;right:420px;top:470px;font-size:130px;font-weight:800;color:#2e7d32;background:#fff;padding:10px 40px;border-radius:30px;box-shadow:0 14px 40px rgba(0,0,0,.25);opacity:0}
</style>
<div id="bg"></div><div id="shot"></div>
<div id="q"><div class="big" id="l1">كم ربحت<br><b>هالشهر؟</b></div></div>
<div id="cnt">3</div><div id="prof">؟؟؟</div>
<div id="sub"><span>إذا ما بتعرف… هالفيديو إلك</span></div>
<div id="flash"></div>
<div id="logo"><img id="lg"><div class="t">محاسبة <b>دليلكم</b> كاملة</div></div>
<script>
const ease={out:t=>1-Math.pow(1-t,3),back:t=>{const c=2;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},inout:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const $=id=>document.getElementById(id);
window.setup=(img,logo)=>{$('bg').style.backgroundImage=`url(${img})`;$('shot').style.backgroundImage=`url(${img})`;$('lg').src=logo};
// 0-1.7 question punch, 1.7-3.4 countdown, 3.4-6.2 screen + profit reveal, 6.2-8 logo sting
window.draw=t=>{
  const q=$('q'),c=$('cnt'),s=$('shot'),sub=$('sub'),pr=$('prof'),fl=$('flash'),lg=$('logo');
  // question: already full size at frame 0, slight breathing punch
  const qa=t<1.7?1:cl(1-(t-1.7)/.25);q.style.opacity=qa;q.style.transform=`scale(${1+0.05*Math.sin(Math.min(t,1.7)*3.2)+ (t<.2?0.08*(1-t/.2):0)})`;
  $('bg').style.transform=`scale(${1+t*0.012})`;
  // countdown
  const ct=t-1.7;if(ct>=0&&ct<1.8){const k=Math.floor(ct/0.6),f=(ct%0.6)/0.6;c.textContent=3-k;c.style.opacity=1;c.style.transform=`scale(${.7+.5*ease.back(cl(f*1.6))})`;if(f>0.85)c.style.opacity=1-(f-.85)/.15}else c.style.opacity=0;
  // screenshot reveal
  const st=t-3.4;if(st>=0&&t<8.95){const p=ease.back(cl(st/.6));s.style.opacity=cl(st/.25);s.style.transform=`scale(${(.8+.2*p)*(1+Math.max(0,st-.6)*0.018)}) rotate(${(1-p)*-4}deg)`;
    sub.style.opacity=cl((st-.7)/.2);sub.style.transform=`translateY(${(1-ease.out(cl((st-.7)/.4)))*80}px)`;
    pr.style.opacity=st>1.5?1:0;pr.textContent=st>1.5&&st<2.1?'؟؟؟':'';pr.style.opacity=st>2.2&&st<3.4?cl((st-2.2)/.15):0}else{s.style.opacity=0;sub.style.opacity=0;pr.style.opacity=0}
  // flash at the cut to the logo
  fl.style.opacity=t>8.75&&t<9.15?1-Math.abs((t-8.95)/.2):0;
  const lt=t-8.95;lg.style.opacity=lt>=0?cl(lt/.3):0;lg.style.transform=`translate(-50%,-50%) scale(${.7+.3*ease.back(cl(lt/.7))})`;
};
</script></html>
