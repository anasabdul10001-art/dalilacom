<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
  /* link-share card 1200x630. WhatsApp crops a centered SQUARE (630x630) for its small thumbnail, so everything important sits inside x 290..910 */
  @font-face { font-family: T; src: url(../fonts/tajawal_bold.ttf); font-weight: 800; }
  html { background: #fff; } body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: T, sans-serif; direction: rtl;
         background: linear-gradient(135deg, #f57a48 0%, #d9502a 100%); }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 18px; background: #fff; opacity:.9; }
  .ring { position: absolute; border-radius: 50%; background: rgba(255,255,255,.12); }
  .c { position: absolute; left: 290px; width: 620px; text-align: center; }
  .logo { top: 50px; height: 110px; left: 345px; }
  .t { font-size: 88px; font-weight: 800; line-height: 1.12; color: #fff; top: 180px; }
  .t span { color: #fff2ea; }
  .url { top: 505px; left: 345px; width: 510px; background: #fff; color: #c8441f; font-size: 44px; font-weight: 800; padding: 6px 0 12px; border-radius: 60px; direction: ltr; }
</style></head>
<body>
  <div class="ring" style="width:520px;height:520px;left:-170px;top:200px"></div>
  <div class="ring" style="width:420px;height:420px;right:-140px;top:-150px"></div>
  
  <img class="c logo" src="../logo/logo-full-horizontal-white.png" alt="دليلكم" style="width:auto;left:auto;right:auto;position:absolute;left:50%;transform:translateX(-50%)">
  <div class="c t">محلات مدينتك<br><span>وعروضها<br>بمكان واحد</span></div>
  <div class="c url">dalilacom.com</div>
</body></html>
