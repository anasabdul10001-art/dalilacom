<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
  /* link-share card (WhatsApp, Facebook, Telegram...): 1200 x 630. Light background, big dark text: readable even as a small thumbnail */
  @font-face { font-family: T; src: url(../fonts/tajawal_bold.ttf); font-weight: 800; }
  @font-face { font-family: T; src: url(../fonts/tajawal_medium.ttf); font-weight: 500; }
  html { background: #fff; } body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: T, sans-serif; direction: rtl;
         background: linear-gradient(135deg, #fffaf6 0%, #ffe6d6 100%); }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 18px; background: linear-gradient(90deg, #f48050, #e8643a); }
  .logo { position: absolute; top: 70px; right: 70px; height: 130px; }
  .t1 { position: absolute; right: 70px; top: 235px; font-size: 100px; font-weight: 800; color: #2a1f1c; line-height: 1.1; }
  .t2 { position: absolute; right: 70px; top: 345px; font-size: 100px; font-weight: 800; color: #e8643a; line-height: 1.1; }
  .url { position: absolute; right: 70px; bottom: 56px; background: #e8643a; color: #fff; font-size: 46px; font-weight: 800; padding: 10px 44px 16px; border-radius: 60px; direction: ltr; }
  .ring { position: absolute; left: -130px; bottom: -170px; width: 560px; height: 560px; border-radius: 50%; background: rgba(244,128,80,.14); }
</style></head>
<body>
  <div class="ring"></div><div class="bar"></div>
  <img class="logo" src="../logo/logo-full-horizontal-color.png" alt="دليلكم">
  <div class="t1">محلات مدينتك</div>
  <div class="t2">وعروضها بمكان واحد</div>
  <div class="url">dalilacom.com</div>
</body></html>
