<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  /* Facebook page cover: 1640 x 624 (shown 820 x 312 on a computer; the middle 640px stay visible on a phone) */
  body { width: 1640px; height: 624px; overflow: hidden; background: linear-gradient(100deg, var(--deep), var(--red) 78%); position: relative; }
  .center { position: absolute; inset: 0; display: grid; place-items: center; }
  .box { display: flex; align-items: center; gap: 44px; }
  .mark { width: 230px; height: 230px; border-radius: 52px; background: #fff; display: grid; place-items: center; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); }
  .mark img { width: 170px; }
  .txt { color: #fff; }
  .name { font-size: 118px; letter-spacing: -1px; }
  .tag { font-size: 40px; font-weight: 700; opacity: .96; margin-top: 6px; }
  .url { font-size: 28px; margin-top: 18px; opacity: .85; }
  .ring { position: absolute; border: 2px solid rgba(255,255,255,.12); border-radius: 50%; }
</style></head>
<body>
  <div class="ring" style="width:620px;height:620px;left:-180px;top:-120px"></div>
  <div class="ring" style="width:420px;height:420px;right:-90px;bottom:-190px"></div>
  <div class="center"><div class="box">
    <div class="mark"><img src="../logo/logo-color.png" alt=""></div>
    <div class="txt">
      <div class="name head">دليلكم</div>
      <div class="tag">محلات مدينتك وعروضها بمكان واحد</div>
      <div class="url latin">dalilacom.com</div>
    </div>
  </div></div>
</body></html>
