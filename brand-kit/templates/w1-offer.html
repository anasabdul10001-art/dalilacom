<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* week 1, day 7: the launch offer (square 1080 x 1080). Same words work for both pages (colloquial and Fusha). */
  body { width: 1080px; height: 1080px; overflow: hidden; background: linear-gradient(160deg, var(--deep), var(--red) 70%); color: #fff; position: relative; padding: 84px; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
  .top { display: flex; justify-content: center; }
  .top img { height: 110px; }
  .tag { display: inline-block; background: #fff; color: var(--deep); font-size: 44px; font-weight: 700; padding: 10px 40px; border-radius: 999px; }
  .big { font-size: 330px; line-height: .8; font-weight: 700; margin-top: 40px; }
  h2 { font-size: 92px; font-weight: 700; margin-top: 4px; }
  p { font-size: 42px; margin-top: 18px; opacity: .95; }
  .row { display: flex; justify-content: center; gap: 24px; margin-top: 34px; }
  .pill { border: 3px solid rgba(255,255,255,.75); border-radius: 22px; padding: 12px 30px; font-size: 36px; font-weight: 700; }
  .foot { font-size: 40px; font-weight: 700; }
</style></head>
<body>
  <div class="top"><img src="../logo/logo-full-horizontal-white.png" alt="دليلكم"></div>
  <div>
    <span class="tag">عرض الإطلاق</span>
    <div class="big">٣</div>
    <h2>شهور مجاناً</h2>
    <p>المحاسبة لأصحاب الأنشطة، لفترة محدودة</p>
    <div class="row"><div class="pill">بدون بطاقة دفع</div><div class="pill">بدون سحب تلقائي</div></div>
  </div>
  <div class="foot latin">dalilacom.com</div>
</body></html>
