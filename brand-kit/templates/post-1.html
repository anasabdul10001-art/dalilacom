<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  /* square post 1080 x 1080: the announcement (what is Dalilacom) */
  body { width: 1080px; height: 1080px; overflow: hidden; background: var(--warm); position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 84px; }
  .top { display: flex; align-items: center; gap: 22px; }
  .top img { height: 118px; }
  .top b { font-size: 46px; }
  h1 { font-size: 104px; color: var(--ink); }
  h1 span { color: var(--red); }
  p { font-size: 40px; color: var(--muted); line-height: 1.7; margin-top: 26px; max-width: 800px; }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .btn { background: var(--ui-red); color: #fff; padding: 22px 46px; border-radius: 28px; font-size: 38px; font-weight: 800; }
  .url { font-size: 34px; color: var(--muted); }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 18px; background: linear-gradient(90deg, var(--deep), var(--red)); }
</style></head>
<body>
  <div class="bar"></div>
  <div class="top"><img src="../logo/logo-full-horizontal-color.png" alt="دليلكم"></div>
  <div>
    <h1 class="head">كل محلات <span>مدينتك</span><br>بمكان واحد</h1>
    <p>ابحث عن المحل أو الخدمة، شوف الأقرب إليك، وخذ العروض والحسومات ببطاقة واحدة.</p>
  </div>
  <div class="foot"><div class="btn">ابحث الآن</div><div class="url latin">dalilacom.com</div></div>
</body></html>
